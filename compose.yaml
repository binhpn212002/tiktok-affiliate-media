services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: tiktok_afiliate
      POSTGRES_PASSWORD: ${TIKTOK_POSTGRES_PASSWORD:?Set TIKTOK_POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_clean_data:/var/lib/postgresql/data

volumes:
  postgres_clean_data:
